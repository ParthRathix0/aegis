specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AegisV4
    network: sepolia
    source:
      address: "0x0a16364229EeFDA44332cB6D194E20937C51CE5b"
      abi: AegisV4
      startBlock: 11654395
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Batch
        - Order
        - OracleObservation
        - OracleWeight
        - Settlement
      abis:
        - name: AegisV4
          file: ./abis/AegisV4.json
      eventHandlers:
        - event: BatchCreated(indexed uint256,address,uint256)
          handler: handleBatchCreated
        - event: BatchStateChanged(indexed uint256,uint8,uint256)
          handler: handleBatchStateChanged
        - event: Deposited(indexed uint256,indexed address,uint256,uint8)
          handler: handleDeposited
        - event: OraclePriceCollected(indexed uint256,indexed uint256,uint256,bool)
          handler: handleOraclePriceCollected
        - event: OracleWeightUpdated(indexed uint256,uint256,uint256,int256,int256)
          handler: handleOracleWeightUpdated
        - event: BatchSettled(indexed uint256,uint256,uint256,uint256)
          handler: handleBatchSettled
        - event: BatchVoided(indexed uint256,string)
          handler: handleBatchVoided
        - event: Claimed(indexed uint256,indexed address,uint256,uint256)
          handler: handleClaimed
      file: ./src/mapping.ts
